apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loan-approval-hpa
  namespace: loan-app
  labels:
    app: loan-approval-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-approval-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

