apiVersion: v1
kind: Service
metadata:
  name: loan-approval-service
  namespace: loan-app
  labels:
    app: loan-approval-app
    app.kubernetes.io/name: loan-approval
spec:
  type: NodePort
  selector:
    app: loan-approval-app
  ports:
    - name: http-ui
      port: 8501
      targetPort: 8501
      nodePort: 30501
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP

