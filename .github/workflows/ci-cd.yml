name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint codebase with Flake8
        run: |
          flake8 app.py src tests streamlit_app.py scripts

      - name: Run automated pytest suite
        run: |
          pytest tests/

  build-and-push:
    name: Build & Push Docker Image (GHCR)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke Test & Endpoints Validation
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${{ env.REGISTRY }}/${REPO_LOWER}:latest"
          echo "Pulling image: ${IMAGE_URI}"
          docker pull "${IMAGE_URI}"
          echo "Starting container for health and metrics validation..."
          docker run -d --name smoke-test -p 8501:8501 -p 8000:8000 "${IMAGE_URI}"
          sleep 8
          docker ps
          echo "Testing Streamlit health endpoint (/_stcore/health)..."
          curl -f http://localhost:8501/_stcore/health
          echo "Testing Prometheus metrics endpoint (:8000/metrics)..."
          curl -f http://localhost:8000/metrics | grep "loan_model_info"
          docker stop smoke-test && docker rm smoke-test
          echo "Smoke test passed successfully!"
